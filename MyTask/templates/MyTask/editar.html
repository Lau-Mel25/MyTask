{% extends 'base.html' %}

{% block title %}Editar: {{ tarea.titulo }} · MyTask{% endblock %}

{% block content %}
<div class="tarjeta tarjeta-estrecha">
    <a class="volver" href="{% url 'mytask:detalle' tarea.id %}">← Cancelar</a>
    <h1>Editar tarea</h1>
    <p class="meta">Actualiza el título o la descripción de la tarea.</p>

    {% if error %}
        <div class="mensaje error" role="alert">{{ error }}</div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="campo">
            <label for="titulo">Título</label>
            <input type="text" id="titulo" name="titulo" value="{{ tarea.titulo }}" maxlength="100" required>
        </div>
        <div class="campo">
            <label for="descripcion">Descripción</label>
            <textarea id="descripcion" name="descripcion" rows="4">{{ tarea.descripcion }}</textarea>
        </div>
        <div class="acciones">
            <button class="boton" type="submit">Guardar cambios</button>
            <a class="boton boton-secundario" href="{% url 'mytask:detalle' tarea.id %}">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
