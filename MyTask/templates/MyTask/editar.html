<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar: {{ tarea.titulo }}</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; color: #222; }
        form { margin: 12px 0; }
        label { display: block; margin-top: 12px; font-weight: bold; }
        input[type=text], textarea { padding: 6px; width: 100%; box-sizing: border-box; font-family: inherit; }
        button { margin-top: 16px; }
        .error { color: #b00020; }
        a { text-decoration: none; color: #2255aa; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <a href="{% url 'mytask:detalle' tarea.id %}">&larr; Cancelar</a>
    <h1>Editar tarea</h1>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post">
        {% csrf_token %}
        <label for="titulo">Título</label>
        <input type="text" id="titulo" name="titulo" value="{{ tarea.titulo }}" maxlength="100" required>
        <label for="descripcion">Descripción</label>
        <textarea id="descripcion" name="descripcion" rows="4">{{ tarea.descripcion }}</textarea>
        <button type="submit">Guardar cambios</button>
    </form>
</body>
</html>
