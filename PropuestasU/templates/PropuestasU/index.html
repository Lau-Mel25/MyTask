<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Propuestas Universitarias</title>
</head>
<body>
    <h1>Propuestas Universitarias</h1>

    {% if propuestas %}
        <ul>
            {% for propuesta in propuestas %}
                <li>
                    <a href="{% url 'propuestas:detalle' propuesta.id %}">
                        {{ propuesta.titulo }}
                    </a>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No hay propuestas todavía.</p>
    {% endif %}
</body>
</html>
